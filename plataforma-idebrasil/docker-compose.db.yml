---
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: idebrasil_platform
      MYSQL_USER: idebrasil
      MYSQL_PASSWORD: idebrasilpass
    ports:
      - '3307:3306'
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
    driver: local
